<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Exam</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://kit.fontawesome.com/4ea1695061.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

</head>
<body>
    
    <header style="display: flex; justify-content: space-between;" id="head">
        <div style="display: flex; align-items: center;">

            <button id="sidebtn" class="btn1"><i class="fa-solid fa-bars"></i></button>
            <h1 id="headtext">MR Exam</h1>
        </div>
        <button id="home2"><i class="fa-regular fa-house"></i></button>
    </header>

    <aside id="side">
        
        <div id="all">
            <h2 id="name">MR Exam</h2>
            <h4 id="theme">Theme</h4>
            <select id="select">
                <option id="blue" value="">Select a Theme!</option>
                <option id="blue" value="dodgerblue">Blue</option>
                <option id="green" value="lightgreen">Green</option>
                <option id="orange" value="orange">Orange</option>
                <option id="red" value="tomato">Red</option>
            </select>
        </div>
        <button id="hideside" class="btn1">X</button>
    </aside>
    
    <div id="content">
        <div id="score">
            
            <div id="showbtns">

                <button id="showpass" class="showbtn">Passage</button>
                <button id="hidepass" class="showbtn" style="display: none;">Passage</button>
                <div id="vhbtns">

                    <button id="vertibtn" style="display: none;" class="showbtn">V</button>
                    <button id="horibtn" class="showbtn">H</button>
                </div>
            </div>
        </div>
        <div id="passage">
            
        </div>


        <div id="cards" class="cards">
        </div>
    </div>
    <script src="index2.js"></script>
</body>
</html>
