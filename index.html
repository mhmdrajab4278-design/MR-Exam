<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Exam</title>
    <link href="style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

    <aside id="side">
        
        <div id="all">
            <h2 id="name">MR Exam</h2>
            <h4 id="theme">Theme</h4>
            <select id="select">
                <option id="blue" value="">Select a Theme!</option>
                <option id="blue" value="dodgerblue">Blue</option>
                <option id="green" value="lightgreen">Green</option>
                <option id="orange" value="orange">Orange</option>
                <option id="red" value="tomato">Red</option>
            </select>
        </div>
        <button id="hideside" class="btn1">X</button>
    </aside>
    

    <header id="head">
        <button id="sidebtn" class="btn1"><i class="fa-solid fa-bars"></i></button>
        <h1 id="name">MR.Exam</h1>
        <div id="cate">
            <a class="links" href="https://web.facebook.com/muhammad.rajab.405683"><i class="fa-brands fa-facebook-f"></i></a>
            <a class="links" ><i class="fa-brands fa-linkedin-in"></i></a>
            <a class="links" href="mhmdrajab4278@gmail.com"><i class="fa-brands fa-instagram"></i></a>
        </div>

    </header>
    <div id="filter-container">

            <button id="filter"><i class="fa-solid fa-filter"></i></button>

            <div id="filter-form" class="filters">

                <button class="f-btns" id="all2">All</button>
                <button class="f-btns" id="history">History</button>
                <button class="f-btns" id="school">School</button>
                <button class="f-btns" id="geography">Geog.</button>
                <button class="f-btns" id="animals">Animals</button>
                <button class="f-btns" id="logic">Logics</button>

            </div>

    </div>
    <footer class="foot">
        <form id="quiz-form"> 

            <div class="rdiv">
                <input id="squiz" type="radio" name="quizes">
                <label for="squiz">5 Questions</label>

            </div>

            <div class="rdiv">
                
                <input id="quiz" type="radio" name="quizes">
                <label for="quiz">10 Questions</label>
            </div>

            <div class="rdiv">
                <input id="lquiz" type="radio" name="quizes">
                <label for="lquiz">20 Questions</label>
                
            </div>

            <div class="rdiv">
                <input id="fexam" type="radio" name="quizes">
                <label for="fexam">All Questions</label>
                
            </div>
    
    
        </form>

        <button id="next">Next</button>
        <button id="cancel">Cancel</button>
    </footer>
    <div id="cards">
    </div>
    <script src="index.js"></script>
</body>
</html>
